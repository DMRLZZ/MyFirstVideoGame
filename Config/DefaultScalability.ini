; Texture settings of LEFTRIGHT on top of Engine/Config/BaseScalability.ini. Owner: rendering-engineer.
;
; The road is seen at grazing angles at 200+ km/h: with the engine's 4x (High) or 8x (Epic) anisotropic filtering the
; asphalt and the paint turn to mush a few meters ahead of the car. 16x costs little on any GPU the game targets.
; The larger pools keep the streamer from holding textures at low mips on 6 GB cards (the pool is still capped by VRAM).

[TextureQuality@1]
r.MaxAnisotropy=8

[TextureQuality@2]
r.MaxAnisotropy=16
r.VT.MaxAnisotropy=16
r.Streaming.PoolSize=1500

[TextureQuality@3]
r.MaxAnisotropy=16
r.VT.MaxAnisotropy=16
r.Streaming.PoolSize=2000
