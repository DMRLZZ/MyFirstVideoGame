; LEFTRIGHT engine configuration.
; Ownership (docs/05-AGENTS.md): build/packaging sections -> build-release-engineer,
; rendering sections -> rendering-engineer, physics -> vehicle-physics-engineer.

[/Script/EngineSettings.GameMapsSettings]
; The grey-box world is built entirely from code (road, traffic, sky), so the empty engine map is enough.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/LRGameplay.LRGameModeEndless
GameInstanceClass=/Script/Engine.GameInstance

[/Script/Engine.Engine]
bSmoothFrameRate=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
; Lumen GI + reflections, Virtual Shadow Maps, Nanite-ready (docs/03-RENDERING.md §2).
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=True
r.AntiAliasingMethod=4
r.Nanite.ProjectEnabled=True
r.SkinCache.CompileShaders=True

[/Script/Engine.PhysicsSettings]
; Stable vehicle physics at 300+ km/h: substep at 120 Hz, up to 4 substeps per frame (ADR-005).
bSubstepping=True
bSubsteppingAsync=False
MaxSubstepDeltaTime=0.008333
MaxSubsteps=4
DefaultGravityZ=-980.0

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

[CoreRedirects]
